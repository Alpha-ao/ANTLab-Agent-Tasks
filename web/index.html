<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档核验 · 基础实验</title>
<style>
:root{font:15px system-ui;color:#18312c;background:#f3f6f4}body{max-width:1120px;margin:30px auto;padding:0 20px}h1{font-size:30px;margin-bottom:8px}p{line-height:1.7}.muted{color:#61736d}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.card{min-width:0;background:white;border:1px solid #d7e2db;border-radius:14px;padding:22px;margin:18px 0}label{display:block;font-weight:600;margin:12px 0 6px}select,textarea,button{font:inherit;border:1px solid #bbcfc4;border-radius:7px;padding:10px;box-sizing:border-box}select,textarea{width:100%;background:#fff}textarea{resize:vertical;line-height:1.6}button{background:#176347;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:12px}.row>*{flex:1}#answer{font-size:26px;font-weight:650;margin:15px 0}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#f2f5f3;padding:12px;max-height:420px;overflow:auto}summary{cursor:pointer;padding:8px 0}#status{min-height:24px;font-weight:600}small{color:#61736d}article{border-left:3px solid #7ba994;padding:2px 14px;margin:14px 0}article p{font-size:14px}@media(max-width:750px){.grid{display:block}.row{flex-wrap:wrap}}
</style>
<h1>文档核验 · 基础实验</h1><p class="muted">先看原文，再核对答案。原始结果、首次失败和改进对照都保留。</p>
<div class="grid"><section class="card">
<label for="case">载入题包样例</label><select id="case"></select>
<label for="question">问题（可以修改）</label><textarea id="question" rows="3"></textarea>
<label for="passages">可见资料（JSON，可以修改）</label><textarea id="passages" rows="8"></textarea>
<div class="row"><div><label for="variant">资料组织</label><select id="variant"><option value="baseline">原始顺序</option><option value="improved">相关排序</option></select></div><div><label for="mode">运行方式</label><select id="mode"><option value="dry">免费预览输入</option><option value="paid">真实 API（计费）</option></select></div></div>
<p><button id="run" type="button">执行核验</button></p><small id="budget"></small><p id="status" role="status"></p>
</section><section class="card"><h2>本次结果</h2><div id="answer">等待运行或回放</div><p id="meta" class="muted"></p><div id="evidence"></div><details><summary>实际输入与原始响应</summary><pre id="raw"></pre></details></section></div>
<section class="card"><h2>已有记录</h2><p class="muted">正式首轮与探索实验分开记录；回放不调用模型。</p><div class="row"><select id="history" aria-label="选择历史记录"></select><button id="replay" type="button">回放所选记录</button></div></section>
<script>
const el=id=>document.getElementById(id);let cases=[];
async function json(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function loadCase(){const c=cases.find(x=>x.id===el('case').value);el('question').value=c.question;const ps=new Map(c.passages.map(p=>[p.id,p]));el('passages').value=JSON.stringify(c.conditions.R0.map(id=>ps.get(id)),null,2)}
async function refresh(){const s=await json('/api/status');el('budget').textContent='模型：DeepSeek Flash · 当前网页剩余付费次数：'+s.paid_remaining+' · 全项目上限10元';const rs=await json('/api/results');el('history').replaceChildren();for(const r of rs.sort((a,b)=>b.utc.localeCompare(a.utc))){const o=document.createElement('option');o.value=r.run_id;o.textContent=[r.experiment||'首轮',r.case_id,r.condition,r.variant,r.status,r.run_id.slice(0,8)].join(' / ');el('history').append(o)}}
function render(r){el('raw').textContent=JSON.stringify(r,null,2);let out=null;try{out=JSON.parse(r.response.choices[0].message.content)}catch{}el('answer').textContent=out?.answer||'仅预览：尚未调用模型';el('meta').textContent='记录 '+r.run_id+' · '+r.status+(r.elapsed_seconds!=null?' · '+r.elapsed_seconds.toFixed(2)+'秒':'')+' · 语义支持：尚未人工核验';el('evidence').replaceChildren();if(out){const ps=JSON.parse(r.messages.find(m=>m.role==='user').content).passages;for(const id of out.citations){const p=ps.find(p=>p.id===id);const a=document.createElement('article');const h=document.createElement('strong');h.textContent=id+' · '+(p?'来源可定位':'引用无效');const t=document.createElement('p');t.textContent=p?p.text.split('。')[0]+'。':'本次资料不存在该编号';a.append(h,t);if(p){const detail=document.createElement('details'),summary=document.createElement('summary'),full=document.createElement('p');summary.textContent='展开完整原文';full.textContent=p.text;detail.append(summary,full);a.append(detail)}el('evidence').append(a)}}}
el('case').addEventListener('change',loadCase);
el('run').addEventListener('click',async()=>{el('run').disabled=true;el('status').textContent='处理中…';try{const r=await json('/api/run',{method:'POST',headers:{'Content-Type':'application/json','X-Assessment-Session':'__TOKEN__'},body:JSON.stringify({question:el('question').value,passages:JSON.parse(el('passages').value),variant:el('variant').value,mode:el('mode').value})});render(r);el('status').textContent='已完成并保存原始记录';await refresh()}catch(e){el('status').textContent='未完成：'+e.message}finally{el('run').disabled=false}});
el('replay').addEventListener('click',async()=>{try{render(await json('/api/result?id='+encodeURIComponent(el('history').value)));el('status').textContent='回放完成，未调用模型'}catch(e){el('status').textContent=e.message}});
(async()=>{try{cases=await json('/api/cases');for(const c of cases){const o=document.createElement('option');o.value=c.id;o.textContent=c.id+' '+c.question;el('case').append(o)}loadCase();await refresh()}catch(e){el('status').textContent='载入失败：'+e.message}})();
</script></html>
